services:
  api:
    image: ${CI_REGISTRY_IMAGE}:${DOCKER_IMAGE_TAG:-latest}
    deploy:
      placement:
        constraints:
          - node.labels.Services == true
      replicas: 1
      restart_policy:
        condition: any
        max_attempts: 3
    ports:
      - target: 8080
        published: ${API_PORT:-18080}
        protocol: tcp
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      SWAGGER_SERVER_URL: ${SWAGGER_SERVER_URL}
    depends_on:
      - postgres
    networks:
      - default

  postgres:
    image: postgres:16-alpine
    deploy:
      placement:
        constraints:
          - node.labels.Services == true
      replicas: 1
      restart_policy:
        condition: any
        max_attempts: 3
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default

volumes:
  postgres_data:
    driver: local
