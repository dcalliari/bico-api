# Desativa a inicialização por script SQL exclusivamente no ambiente de testes
spring.sql.init.mode=never

# Configuração mínima para testes
spring.datasource.url=jdbc:h2:mem:bicos;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.flyway.enabled=false

api.security.token.secret=test-secret
