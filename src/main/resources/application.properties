spring.application.name=bicos

# Spring Config Properties
spring.config.import=optional:file:.env[.properties]

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bicos}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT Security
# WARNING: Use environment variable in production: ${JWT_SECRET}
api.security.token.secret=${JWT_SECRET}

# Ordenação de métodos
springdoc.swagger-ui.operations-sorter=alpha

# Swagger/OpenAPI server URL
swagger.server.url=${SWAGGER_SERVER_URL}

# Health Checker
management.endpoints.web.exposure.include=prometheus,health
management.endpoint.health.show-details=always
management.health.redis.enabled=false
management.endpoints.web.base-path=/

# Ler arquivo no .env
cors.allowed-origins=${ALLOWED_ORIGINS}

# Desativa a inicialização por script SQL direta quando Flyway está habilitado
spring.sql.init.mode=never

# Jackson: serialize java.time types as ISO strings (not as arrays/timestamps)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

springdoc.swagger-ui.persist-authorization=true