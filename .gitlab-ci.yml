stages:
  - build
  - test
  - deploy

variables:
  GIT_CLEAN_FLAGS: none
  DOCKER_IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

.ci_registry_login:
  before_script:
    - echo "${CI_REGISTRY_PASSWORD}" | docker login --username "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"

.ci_deploy_registry_login:
  before_script:
    - env | grep -E '^[A-Za-z_][A-Za-z0-9_]*=' | grep -v '^CI_COMMIT_MESSAGE=' | grep -v '^CI_COMMIT_TITLE=' | grep -v '^CI_COMMIT_DESCRIPTION=' > .env
    - |
      if [ -n "${REGISTRY_USERNAME:-}" ] && [ -n "${REGISTRY_PASSWORD:-}" ]; then
        echo "${REGISTRY_PASSWORD}" | docker login --username "${REGISTRY_USERNAME}" --password-stdin "${CI_REGISTRY}"
      else
        echo "${CI_REGISTRY_PASSWORD}" | docker login --username "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
      fi

.build_tags:
  tags:
    - shell

.test_tags:
  tags:
    - shell

.deploy_tags:
  tags:
    - ssh
    - solar-srv1

check-approval:
  stage: .pre
  image: alpine:latest
  script:
    - echo "MR precisa de revisão antes do merge"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: true

.build:
  stage: build
  extends:
    - .ci_registry_login
    - .build_tags
  cache:
    key: ${CI_PROJECT_NAME}-maven
    paths:
      - .m2/repository
  script:
    - docker compose -f docker-compose.build.yml build
    - echo "${CI_REGISTRY_PASSWORD}" | docker login --username "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
    - docker push "${CI_REGISTRY_IMAGE}:${DOCKER_IMAGE_TAG}"
    - docker tag "${CI_REGISTRY_IMAGE}:${DOCKER_IMAGE_TAG}" "${CI_REGISTRY_IMAGE}:${CI_COMMIT_BRANCH}-${DOCKER_IMAGE_TAG}"
    - docker push "${CI_REGISTRY_IMAGE}:${CI_COMMIT_BRANCH}-${DOCKER_IMAGE_TAG}"

.test:
  stage: test
  extends:
    - .test_tags
  variables:
    DB_HOST: localhost
    DB_PORT: "5433"
    DB_NAME: bicos_test
    DB_USER: bicos
    DB_PASSWORD: test
    JWT_SECRET: ci-test-secret
    ALLOWED_ORIGINS: http://localhost:3000
  cache:
    key: ${CI_PROJECT_NAME}-maven
    paths:
      - .m2/repository
  script:
    - docker compose -f docker/docker-compose.test.yml up -d --wait postgres
    - chmod +x mvnw
    - ./mvnw test -B
  after_script:
    - docker compose -f docker/docker-compose.test.yml down -v || true

.deploy:
  stage: deploy
  extends:
    - .ci_deploy_registry_login
    - .deploy_tags
  after_script:
    - docker stack ps "${STACK_NAME}" || true

build_homol:
  extends: .build
  environment:
    name: homol
  variables:
    DOCKER_IMAGE_TAG: homol
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: '$CI_COMMIT_BRANCH == "homol"'

test_homol:
  extends: .test
  needs:
    - job: build_homol
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: '$CI_COMMIT_BRANCH == "homol"'

deploy_homol:
  extends: .deploy
  environment:
    name: homol
    url: $APP_DOMAIN
  variables:
    DOCKER_IMAGE_TAG: homol
    STACK_NAME: bico-api-hm
  needs:
    - build_homol
    - test_homol
  script:
    - export STACK_NAME="${STACK_NAME:-bico-api-hm}"
    - docker stack deploy --with-registry-auth --compose-file=docker-compose.deploy.yml "${STACK_NAME}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: '$CI_COMMIT_BRANCH == "homol"'

build_prod:
  extends: .build
  environment:
    name: production
  variables:
    DOCKER_IMAGE_TAG: latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

test_prod:
  extends: .test
  needs:
    - job: build_prod
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy_prod:
  extends: .deploy
  environment:
    name: production
    url: $APP_DOMAIN
  variables:
    DOCKER_IMAGE_TAG: latest
    STACK_NAME: bico-api
  needs:
    - build_prod
    - test_prod
  script:
    - export STACK_NAME="${STACK_NAME:-bico-api}"
    - docker stack deploy --with-registry-auth --compose-file=docker-compose.deploy.yml "${STACK_NAME}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

test_merge_request:
  extends: .test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
