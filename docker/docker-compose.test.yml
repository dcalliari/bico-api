services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-bicos_test}
      POSTGRES_USER: ${DB_USER:-bicos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-test}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bicos} -d ${DB_NAME:-bicos_test}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
